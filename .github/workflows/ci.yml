name: CI

# Unit tests (all modules, incl. core/data's JVM Room tests), lint, and debug
# builds of both flavors, as three parallel jobs. One combined Gradle run hung
# after its last task on two runs in a row, so each job keeps its Gradle
# invocation small. The `android` job is the single required check and passes
# only when all three do. The iOS compile lives in ios-compile.yml; device
# tests stay manual (see app-android/CLAUDE.md).
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gradle:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test
            tasks: test :core:data:jvmTest :features:recommendations:scoreboard
            # A multi-line value: upload-artifact's `path` takes one glob per line.
            reports: |
              app-android/**/build/reports/tests/
              app-android/**/build/reports/scoreboard/
          - name: lint
            tasks: lint
            reports: app-android/**/build/reports/lint-results-*.html
          - name: build
            tasks: assembleFullDebug assembleFossDebug
            reports: app-android/build/reports/problems/

    defaults:
      run:
        working-directory: app-android

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: ./gradlew ${{ matrix.tasks }}
        run: ./gradlew ${{ matrix.tasks }} --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.name }}
          path: ${{ matrix.reports }}
          retention-days: 7

  # "Now" and "today" are read through AppClock (#112). Only the clock itself and the
  # entity timestamp defaults may read the system clock directly.
  clock-reads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No direct system-clock reads outside AppClock
        working-directory: app-android
        run: |
          allowed='core/data/src/commonMain/kotlin/com/closet/core/data/(time/AppClock|model/ClothingItemEntity|model/OutfitEntities)\.kt'
          hits=$(grep -rlE 'Clock\.System|currentSystemDefault\(\)|System\.currentTimeMillis\(\)' --include=*.kt \
            core features shared platform app \
            | grep -E '/src/(commonMain|androidMain|jvmMain|iosMain|main)/' \
            | grep -vE "$allowed" || true)
          if [ -n "$hits" ]; then
            echo "::error::Read now/today through AppClock (com.closet.core.data.time), not the system clock:"
            echo "$hits"
            exit 1
          fi

  # The required status check. Kept under its old name so the branch ruleset
  # doesn't change; fails unless every gradle job and the clock check succeeded.
  android:
    needs: [gradle, clock-reads]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All Gradle jobs passed
        run: |
          if [ "${{ needs.gradle.result }}" != "success" ] || [ "${{ needs.clock-reads.result }}" != "success" ]; then
            echo "::error::Gradle jobs: ${{ needs.gradle.result }}, clock check: ${{ needs.clock-reads.result }}"
            exit 1
          fi
