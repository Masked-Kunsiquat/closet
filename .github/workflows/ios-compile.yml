name: iOS compile check

# Compiles all Kotlin Multiplatform modules (main + test sources) for iOS targets.
# Runs on Linux: Kotlin/Native can build iOS klibs on any host with klib
# cross-compilation enabled (only linking a final iOS binary needs a Mac, and
# this check doesn't link). macOS runners were often never acquired.
# Without the flag, Gradle silently SKIPs iOS tasks on Linux, so the step fails
# if any iOS compile task was skipped.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ios-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: app-android

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Kotlin/Native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('app-android/gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile KMP modules for iOS
        run: |
          set -o pipefail
          ./gradlew iosCompileCheck --stacktrace --console=plain             -Pkotlin.native.enableKlibsCrossCompilation=true | tee "$RUNNER_TEMP/ios.log"
          if grep -E "Task :.*:compile(Test)?KotlinIos[A-Za-z0-9]* SKIPPED" "$RUNNER_TEMP/ios.log"; then
            echo "::error::iOS compile tasks were skipped (cross-compilation not active)."
            exit 1
          fi
          count=$(grep -cE "Task :.*:compile(Test)?KotlinIos[A-Za-z0-9]*( UP-TO-DATE| FROM-CACHE)?$" "$RUNNER_TEMP/ios.log" || true)
          echo "iOS compile tasks executed: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::No iOS compile tasks ran."
            exit 1
          fi
