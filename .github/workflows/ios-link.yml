name: iOS framework link

# Links the :shared iOS framework (the export a future iosApp would use).
# Linking a final iOS binary needs Xcode, so this needs a macOS runner. It is
# manual-only (Actions tab -> Run workflow) because macOS runners were often never
# acquired for the per-PR check; ios-compile.yml covers compilation on Linux.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-link:
    runs-on: macos-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: app-android

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Kotlin/Native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('app-android/gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Link the shared iOS framework (simulator + device)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 :shared:linkDebugFrameworkIosArm64 --stacktrace --console=plain
