# Project-wide Gradle settings.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# AGP 9.0 Compatibility
# Opted out of the AGP 9.0 New DSL and built-in Kotlin. The original blocker was the
# previous DI framework's Gradle plugin, which has since been removed; re-enabling these
# is a separate change.
android.newDsl=false
android.builtInKotlin=false

# Cleanup of deprecated flags for AGP 9.1/10.0
# Adoption of performance-improving defaults
android.enableAppCompileTimeRClass=true
android.r8.optimizedResourceShrinking=true
android.defaults.buildfeatures.resvalues=false
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=true
