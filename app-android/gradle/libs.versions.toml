[versions]
koin-bom = "4.2.2"
agp = "9.1.0"
kotlin = "2.4.21"
ksp = "2.3.14"
composeBom = "2026.03.00"
androidxCore = "1.18.0"
androidxLifecycle = "2.10.0"
# JetBrains KMP lifecycle whose Android variant resolves to androidx.lifecycle `androidxLifecycle`; move them together.
jetbrainsLifecycle = "2.10.0"
androidxActivity = "1.13.0"
androidxNavigation = "2.9.7"
# JetBrains navigation-compose 2.9.2 pairs with androidxNavigation 2.9.7 (its Android variant depends on androidx navigation-compose 2.9.7).
jetbrainsNavigation = "2.9.2"
kotlinxSerializationJson = "1.10.0"
kotlinxDatetime = "0.8.0"
kotlinxCoroutines = "1.10.2"
room = "2.8.4"
# The androidx.sqlite version Room 2.8.4 requires; move it in step with Room.
sqliteBundled = "2.6.2"
coil = "3.6.3"
composeMultiplatform = "1.12.2"
# Skiko native runtime for JVM tests; keep equal to the skiko version CMP resolves (see dependencyInsight --dependency skiko).
skiko = "0.150.2"
composeMultiplatformMaterial3 = "1.9.0"
junit = "4.13.2"
androidxTestExt = "1.3.0"
androidxEspresso = "3.7.0"
compileSdk = "37"
targetSdk = "36"
minSdk = "26"
material = "1.13.0"
timber = "5.0.1"
kermit = "2.2.0"
datastorePreferences = "1.3.0"
okio = "3.18.2"
securityCrypto = "1.1.0-alpha06"
vico = "3.0.3"
turbine = "1.2.0"
mockk = "1.13.14"
ktor = "3.1.3"
mlkitGenaiPrompt = "1.0.0-beta5"
mlkitGenaiSchema = "1.0.0-alpha2"
mlkitGenaiImageDescription = "1.0.0-beta1"
mlkitSubjectSegmentation = "16.0.0-beta1" # beta accepted; no stable release exists for this API
mlkitLanguageId = "17.0.6"
mlkitEntityExtraction = "16.0.0-beta6"
kotlinxCoroutinesPlayServices = "1.10.2"
work = "2.10.0"
onnxRuntime = "1.21.0"

[libraries]
koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koin-bom" }
koin-core = { group = "io.insert-koin", name = "koin-core" }
koin-android = { group = "io.insert-koin", name = "koin-android" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel" }
koin-androidx-workmanager = { group = "io.insert-koin", name = "koin-androidx-workmanager" }
koin-test = { group = "io.insert-koin", name = "koin-test" }
koin-test-junit4 = { group = "io.insert-koin", name = "koin-test-junit4" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
jetbrains-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "jetbrainsLifecycle" }
jetbrains-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "jetbrainsLifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
# Not referenced by any module: the JetBrains alias below resolves to this androidx version on Android.
# Kept so `androidxNavigation` names the pairing explicitly.
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
jetbrains-navigation-compose = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "jetbrainsNavigation" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
